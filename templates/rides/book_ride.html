{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Ride | LocalBites</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #EFF6FF;
            min-height: 100vh;
        }
        
        .ride-nav {
            background: rgba(239, 246, 255, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(59, 130, 246, 0.15);
            padding: 16px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .ride-nav-inner {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .ride-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #1A1A1A;
            font-weight: 800;
            font-size: 20px;
        }
        
        .ride-logo-mark {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, #3B82F6, #6366F1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            box-shadow: 0 8px 20px rgba(59,130,246,0.3);
        }
        
        .ride-nav-actions { display: flex; gap: 10px; align-items: center; }
        
        .ride-nav-btn {
            padding: 10px 18px;
            border-radius: 10px;
            background: white;
            color: #1A1A1A;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            border: 1.5px solid rgba(59,130,246,0.2);
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .ride-nav-btn:hover { border-color: #3B82F6; color: #3B82F6; }
        
        .ride-nav-btn.primary {
            background: linear-gradient(135deg, #3B82F6, #6366F1);
            color: white;
            border: none;
            box-shadow: 0 4px 16px rgba(59,130,246,0.3);
        }
        
        .ride-wrap {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 24px;
        }
        
        .ride-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .ride-header h1 {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: -2px;
            color: #1A1A1A;
            margin-bottom: 12px;
        }
        
        .ride-header h1 span {
            background: linear-gradient(135deg, #3B82F6, #6366F1);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .ride-header p {
            color: #6B6B6B;
            font-size: 16px;
        }
        
        .ride-card {
            background: white;
            border-radius: 28px;
            padding: 40px;
            border: 1.5px solid rgba(59,130,246,0.15);
            box-shadow: 0 20px 60px -20px rgba(59,130,246,0.15);
            margin-bottom: 24px;
        }
        
        .section-label {
            font-size: 13px;
            font-weight: 700;
            color: #6B6B6B;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 16px;
            display: block;
        }
        
        .location-inputs {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 32px;
            position: relative;
        }
        
        .location-input-wrapper {
            position: relative;
        }
        
        .location-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: white;
            z-index: 1;
        }
        
        .location-icon.pickup {
            background: linear-gradient(135deg, #22C55E, #16A34A);
        }
        
        .location-icon.drop {
            background: linear-gradient(135deg, #EF4444, #DC2626);
        }
        
        .location-input {
            width: 100%;
            padding: 18px 20px 18px 68px;
            background: #F8FAFF;
            border: 1.5px solid rgba(59,130,246,0.15);
            border-radius: 16px;
            font-size: 15px;
            font-family: inherit;
            color: #1A1A1A;
            transition: all 0.2s;
            font-weight: 500;
        }
        
        .location-input:focus {
            outline: none;
            border-color: #3B82F6;
            background: white;
            box-shadow: 0 0 0 4px rgba(59,130,246,0.1);
        }
        
        .location-input::placeholder {
            color: #9CA3AF;
            font-weight: 400;
        }
        
        .connector-line {
            position: absolute;
            left: 35px;
            top: 40px;
            height: calc(100% - 80px);
            width: 2px;
            background: repeating-linear-gradient(
                to bottom,
                #CBD5E1 0,
                #CBD5E1 4px,
                transparent 4px,
                transparent 8px
            );
            z-index: 0;
        }
        
        /* Vehicle Selection */
        .vehicle-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }
        
        .vehicle-option {
            position: relative;
            cursor: pointer;
        }
        
        .vehicle-option input {
            position: absolute;
            opacity: 0;
        }
        
        .vehicle-option label {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 24px 20px;
            background: white;
            border: 2px solid rgba(59,130,246,0.15);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .vehicle-option label:hover {
            border-color: #93C5FD;
            background: #F8FAFF;
            transform: translateY(-2px);
        }
        
        .vehicle-option input:checked + label {
            border-color: #3B82F6;
            background: linear-gradient(135deg, #EFF6FF, #F8FAFF);
            box-shadow: 0 12px 32px -8px rgba(59,130,246,0.3);
            transform: translateY(-4px);
        }
        
        .vehicle-option input:checked + label::before {
            content: '';
            position: absolute;
            top: 12px;
            right: 12px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #3B82F6;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 0 4px rgba(59,130,246,0.15);
        }
        
        .vehicle-option input:checked + label::after {
            content: '✓';
            position: absolute;
            top: 12px;
            right: 12px;
            width: 20px;
            height: 20px;
            color: white;
            font-size: 12px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }
        
        .vehicle-emoji {
            font-size: 48px;
            line-height: 1;
        }
        
        .vehicle-name {
            font-size: 16px;
            font-weight: 800;
            color: #1A1A1A;
        }
        
        .vehicle-fare {
            font-size: 13px;
            color: #6B6B6B;
            font-weight: 600;
            margin-top: 4px;
        }
        
        .vehicle-fare strong {
            color: #3B82F6;
            font-size: 15px;
        }
        
        .vehicle-eta {
            font-size: 11px;
            color: #9CA3AF;
            font-weight: 600;
            margin-top: 2px;
        }
        
        /* Book Button */
        .book-btn {
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, #3B82F6, #6366F1);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s;
            box-shadow: 0 12px 32px rgba(59,130,246,0.35);
            font-family: inherit;
            letter-spacing: 0.3px;
        }
        
        .book-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 40px rgba(59,130,246,0.5);
        }
        
        /* Features Row */
        .features-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-top: 24px;
        }
        
        .feature-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            background: white;
            border-radius: 16px;
            border: 1.5px solid rgba(59,130,246,0.1);
        }
        
        .feature-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, #DBEAFE, #BFDBFE);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #3B82F6;
            font-size: 16px;
            flex-shrink: 0;
        }
        
        .feature-text strong {
            display: block;
            font-size: 13px;
            font-weight: 800;
            color: #1A1A1A;
        }
        
        .feature-text span {
            font-size: 11px;
            color: #6B6B6B;
        }
        
        @media (max-width: 768px) {
            .ride-card { padding: 24px; }
            .ride-header h1 { font-size: 32px; }
            .vehicle-grid { grid-template-columns: 1fr; }
            .features-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<nav class="ride-nav">
    <div class="ride-nav-inner">
        <a href="/" class="ride-logo">
            <div class="ride-logo-mark"><i class="fas fa-motorcycle"></i></div>
            <span>LocalBites</span>
        </a>
        <div class="ride-nav-actions">
            <a href="/dashboard/" class="ride-nav-btn"><i class="fas fa-home"></i> Dashboard</a>
            <a href="/rides/my-rides/" class="ride-nav-btn primary"><i class="fas fa-history"></i> My Rides</a>
        </div>
    </div>
</nav>

<div class="ride-wrap">
    
    <div class="ride-header">
        <h1>Book a <span>Ride</span> 🏍️</h1>
        <p>Bike, auto, or car — book in seconds</p>
    </div>
    
    <form method="POST">
        {% csrf_token %}
        
        <div class="ride-card">
            
            <!-- Location Inputs -->
            <span class="section-label">
                <i class="fas fa-map-marker-alt" style="margin-right: 6px;"></i>
                Trip Details
            </span>
            
            <div class="location-inputs">
                <div class="connector-line"></div>
                
                <div class="location-input-wrapper">
                    <div class="location-icon pickup">
                        <i class="fas fa-circle"></i>
                    </div>
                    <input type="text" 
                           name="pickup" 
                           class="location-input" 
                           placeholder="Enter pickup location"
                           required>
                </div>
                
                <div class="location-input-wrapper">
                    <div class="location-icon drop">
                        <i class="fas fa-map-pin"></i>
                    </div>
                    <input type="text" 
                           name="drop" 
                           class="location-input" 
                           placeholder="Enter drop location"
                           required>
                </div>
            </div>
            
            <!-- Vehicle Selection -->
            <span class="section-label">
                <i class="fas fa-car" style="margin-right: 6px;"></i>
                Choose Your Ride
            </span>
            
            <div class="vehicle-grid">
                <div class="vehicle-option">
                    <input type="radio" name="vehicle_type" value="bike" id="veh-bike" checked>
                    <label for="veh-bike">
                        <span class="vehicle-emoji">🏍️</span>
                        <span class="vehicle-name">Bike</span>
                        <span class="vehicle-fare">From <strong>₹{{ bike_fare|floatformat:0 }}</strong></span>
                        <span class="vehicle-eta">⚡ Fastest</span>
                    </label>
                </div>
                
                <div class="vehicle-option">
                    <input type="radio" name="vehicle_type" value="auto" id="veh-auto">
                    <label for="veh-auto">
                        <span class="vehicle-emoji">🛺</span>
                        <span class="vehicle-name">Auto</span>
                        <span class="vehicle-fare">From <strong>₹{{ auto_fare|floatformat:0 }}</strong></span>
                        <span class="vehicle-eta">💰 Budget</span>
                    </label>
                </div>
                
                <div class="vehicle-option">
                    <input type="radio" name="vehicle_type" value="car" id="veh-car">
                    <label for="veh-car">
                        <span class="vehicle-emoji">🚗</span>
                        <span class="vehicle-name">Car</span>
                        <span class="vehicle-fare">From <strong>₹{{ car_fare|floatformat:0 }}</strong></span>
                        <span class="vehicle-eta">✨ Comfort</span>
                    </label>
                </div>
            </div>
            
            <!-- Book Button -->
            <button type="submit" class="book-btn">
                <i class="fas fa-search"></i>
                Find Captain
            </button>
            
        </div>
        
    </form>
    
    <!-- Features -->
    <div class="features-row">
        <div class="feature-item">
            <div class="feature-icon"><i class="fas fa-shield-halved"></i></div>
            <div class="feature-text">
                <strong>Verified Captains</strong>
                <span>Background checked</span>
            </div>
        </div>
        <div class="feature-item">
            <div class="feature-icon" style="background: linear-gradient(135deg, #FEF3C7, #FDE68A); color: #F59E0B;">
                <i class="fas fa-bolt"></i>
            </div>
            <div class="feature-text">
                <strong>Quick Pickup</strong>
                <span>Within 3-5 min</span>
            </div>
        </div>
        <div class="feature-item">
            <div class="feature-icon" style="background: linear-gradient(135deg, #DCFCE7, #BBF7D0); color: #16A34A;">
                <i class="fas fa-indian-rupee-sign"></i>
            </div>
            <div class="feature-text">
                <strong>Fixed Fares</strong>
                <span>No surprises</span>
            </div>
        </div>
    </div>
    
</div>

</body>
</html>
