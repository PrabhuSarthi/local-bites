{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Menu Item | LocalBites</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #08080C;
            color: white;
            min-height: 100vh;
        }
        
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -2;
            background: 
                radial-gradient(ellipse at 15% 15%, rgba(99, 102, 241, 0.1) 0%, transparent 45%),
                radial-gradient(ellipse at 85% 85%, rgba(139, 92, 246, 0.08) 0%, transparent 45%);
        }
        
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            background-image: 
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
        }
        
        .wrap {
            max-width: 700px;
            margin: 0 auto;
            padding: 40px 24px;
        }
        
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #8B92A0;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 24px;
        }
        
        .back-link:hover { color: white; }
        
        .card {
            background: linear-gradient(160deg, rgba(28, 28, 42, 0.6), rgba(18, 18, 28, 0.8));
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 40px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        
        .header-icon {
            width: 72px;
            height: 72px;
            border-radius: 20px;
            background: linear-gradient(135deg, #6366F1, #8B5CF6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 16px;
            box-shadow: 0 12px 32px rgba(99,102,241,0.4);
        }
        
        .header h1 {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #818CF8, #22D3EE);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 6px;
        }
        
        .header p { color: #8B92A0; font-size: 14px; }
        
        .form-group { margin-bottom: 20px; }
        
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #E4E7EB;
            margin-bottom: 8px;
        }
        
        .form-label i { color: #818CF8; margin-right: 6px; font-size: 12px; }
        
        .form-input,
        .form-textarea,
        .form-select {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255,255,255,0.03);
            border: 1.5px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            color: white;
            transition: all 0.2s;
        }
        
        .form-input:focus,
        .form-textarea:focus,
        .form-select:focus {
            outline: none;
            border-color: #6366F1;
            background: rgba(99,102,241,0.06);
            box-shadow: 0 0 0 4px rgba(99,102,241,0.15);
        }
        
        .form-textarea { resize: vertical; min-height: 100px; }
        
        .form-select option { background: #1A1A2E; color: white; }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 18px;
            background: rgba(255,255,255,0.03);
            border: 1.5px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            cursor: pointer;
        }
        
        .checkbox-group input {
            width: 18px;
            height: 18px;
            accent-color: #6366F1;
            cursor: pointer;
        }
        
        .checkbox-group span {
            font-size: 14px;
            font-weight: 700;
            color: #E4E7EB;
        }
        
        .btn-row {
            display: flex;
            gap: 12px;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        
        .btn {
            flex: 1;
            padding: 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            font-family: inherit;
            border: none;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #6366F1, #8B5CF6);
            color: white;
            box-shadow: 0 8px 20px rgba(99,102,241,0.35);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(99,102,241,0.5);
        }
        
        .btn-secondary {
            background: rgba(255,255,255,0.03);
            color: #E4E7EB;
            border: 1.5px solid rgba(255,255,255,0.1);
        }
        
        .btn-secondary:hover {
            background: rgba(255,255,255,0.06);
        }
        
        @media (max-width: 640px) {
            .form-row { grid-template-columns: 1fr; }
            .card { padding: 28px 20px; }
        }
    </style>
</head>
<body>

<div class="wrap">
    
    <a href="/food/menu/" class="back-link">
        <i class="fas fa-arrow-left"></i> Back to Menu
    </a>
    
    <div class="card">
        
        <div class="header">
            <div class="header-icon">
                <i class="fas fa-plus-circle"></i>
            </div>
            <h1>Add Menu Item</h1>
            <p>Add a new dish to your restaurant menu</p>
        </div>
        
        <form method="POST">
            {% csrf_token %}
            
            <div class="form-group">
                <label class="form-label"><i class="fas fa-utensils"></i> Item Name *</label>
                <input type="text" name="name" required class="form-input" placeholder="e.g., Paneer Butter Masala">
            </div>
            
            <div class="form-group">
                <label class="form-label"><i class="fas fa-align-left"></i> Description</label>
                <textarea name="description" class="form-textarea" placeholder="Describe the dish..."></textarea>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-rupee-sign"></i> Price (₹) *</label>
                    <input type="number" name="price" required min="1" step="0.01" class="form-input" placeholder="e.g., 280">
                </div>
                
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-folder"></i> Category</label>
                    <select name="category" class="form-select">
                        <option value="">No category</option>
                        {% for category in categories %}
                        <option value="{{ category.id }}">{{ category.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            
            <div class="form-row">
                <label class="checkbox-group">
                    <input type="checkbox" name="is_vegetarian" checked>
                    <span>🌿 Vegetarian</span>
                </label>
                
                <label class="checkbox-group">
                    <input type="checkbox" name="is_available" checked>
                    <span>✅ Available Now</span>
                </label>
            </div>
            
            <div class="btn-row">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-check"></i> Add to Menu
                </button>
                <a href="/food/menu/" class="btn btn-secondary">
                    <i class="fas fa-times"></i> Cancel
                </a>
            </div>
        </form>
        
    </div>
    
</div>

</body>
</html>
